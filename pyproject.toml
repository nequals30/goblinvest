[project]
name = "goblinvest"
version = "0.1.0"
description = "Web UI for personal finance analysis on top of goblinvest-core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "goblinvest-core",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
goblinvest-core = { path = "goblinvest_core", editable = true }

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=9",
    "httpx>=0.28",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
# goblinvest_core is a separate project with its own tooling.
extend-exclude = ["goblinvest_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
