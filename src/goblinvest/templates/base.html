<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Goblinvest{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    {% if user %}
    <header id="topbar">
      <span class="brand">Goblinvest</span>
      <nav></nav>
      <span class="who">{{ user.username }}</span>
      <form method="post" action="/logout"><button type="submit">log out</button></form>
    </header>
    {% endif %}

    <div id="shell">
      {% if user %}
      <aside id="sidebar">
        <nav class="nav-main">
          {% for item in nav %}
          <a class="nav-item {% if request.url.path == item.url %}is-active{% endif %}"
             href="{{ item.url }}">{{ item.label }}</a>
          {% endfor %}
        </nav>
        <nav class="nav-foot">
          <a class="nav-item {% if request.url.path.startswith('/settings') %}is-active{% endif %}"
             href="/settings">Settings</a>
        </nav>
      </aside>
      {% endif %}

      <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
