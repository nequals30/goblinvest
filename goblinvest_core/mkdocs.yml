site_name: goblinvest-core
theme:
  name: material
  palette:
    scheme: slate
    primary: teal
  features:
    - content.code.copy
    - navigation.sections

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - admonition

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
            # The API reference groups Vault's methods under headings of its
            # own, one directive per method, so a method's heading is an h3
            # named for the method alone rather than its full dotted path.
            heading_level: 3
            show_root_full_path: false

nav:
  - Overview: index.md
  - Examples: examples.md
  - API reference: api.md
